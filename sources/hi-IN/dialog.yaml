dialog:
  selectFolder: फ़ोल्डर चुनें
  fileModifiedTitle: फ़ाइल संशोधित की गई
  fileModifiedDesc: >-
    यह फ़ाइल कहीं और संशोधित की गई है। आप नवीनतम सामग्री लोड करने के लिए रीलोड कर सकते हैं, या वर्तमान संस्करण को
    संपादित करना जारी रख सकते हैं (सामग्री विरोध हो सकता है)।
  fileModifiedReload: पुनः लोड करें
