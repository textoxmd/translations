    addFolderDesc: 나중에 설정 → 위치 추가에서 언제든 추가할 수 있습니다.
    empty: 허용할 폴더를 찾지 못했습니다. 수동으로 추가할 수도 있습니다.
  appearance:
    title: 테마 및 모양 선택
    desc: 클릭하여 미리 보세요. 설정에서 언제든 변경할 수 있습니다.
  pluginMode:
    title: 2.0 플러그인 모드
    desc: Textox 2.0부터 플러그인 구조로 변경되었습니다. 아래 기능은 모두 개별적으로 켜고 끄거나 설정할 수 있는 플러그인입니다. 사용자 플러그인도 곧 지원됩니다.
    warnTitle: 이전 버전의 설정은 자동으로 이전되지 않습니다.
    warnDesc: 설정 → 플러그인에서 필요한 항목을 다시 켜고 설정하세요.
