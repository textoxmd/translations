    title: Textox에 오신 것을 환영합니다
    desc: 설정이 완료되었습니다. 이제 작성을 시작하세요.
    hint: 나중에 도움말 → 설정 마법사에서 언제든 다시 열 수 있습니다.
    noPrompt: 다시 자동 표시 안 함
