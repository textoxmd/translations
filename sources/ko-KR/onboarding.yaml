onboarding:
  welcome:
    title: Textox에 오신 것을 환영합니다
  startup:
    title: 시작 모드 선택
    desc: Textox를 열 때 무엇을 볼지 결정하세요.
    blank: 빈 페이지
    blankDesc: 매번 새 문서로 시작
    workspace: 작업 공간 모드
    workspaceDesc: 자주 사용하는 폴더로 바로 열기
    blankHint: 실행할 때마다 깨끗한 빈 문서로 시작합니다
  bookmarks:
    desc: macOS는 앱이 읽을 수 있는 위치를 제한합니다. 허용한 폴더는 자동으로 기억됩니다.
    existingCount: "{{count}}/10개 폴더 허용됨"
    suggest: 추천
