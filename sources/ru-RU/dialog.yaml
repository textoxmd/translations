dialog:
  selectFolder: Выбрать папку
  fileModifiedTitle: Файл изменен
  fileModifiedDesc: >-
    Этот файл был изменен в другом месте. Вы можете перезагрузить файл, чтобы загрузить последнее содержимое, или
    продолжить редактирование текущей версии (может вызвать конфликты содержимого).
  fileModifiedReload: Перезагрузить
  saveConflictOverwrite: Перезаписать
  saveConflictDesc: >-
    Этот файл был изменен на диске извне. Вы можете перезаписать его (отбросив внешние изменения), перезагрузить
    последнее содержимое (отбросив несохраненные изменения) или отменить.
