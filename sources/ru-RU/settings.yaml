  colorThemePastelStory: >-
    Вдохновившись вазой GRÅVITS от IKEA, мне посчастливилось встретить phycat в сообществе Typora. Её лёгкая, воздушная
    палитра цветущей сакуры, расслабленная и тёплая атмосфера — именно то, что я представлял. Путём послойных доработок
    и адаптации родился мягкий, уютный и визуально приятный опыт письма для Textox.
  colorThemeSpringStory: >-
    Весна символизирует начало и надежду. Textox запустился весной 2026 года — знаменательное время для проекта. Тема
    Jingzhe выполнена в мягких, чистых растительных зелёных тонах, которые сами по себе передают весеннее пробуждение
    природы. Адаптированная для Textox, она привносит в каждую сессию письма свежую, лёгкую атмосферу весеннего утра.
