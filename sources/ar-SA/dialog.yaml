dialog:
  selectFolder: تحديد المجلد
  fileModifiedTitle: تم تعديل الملف
  fileModifiedDesc: >-
    تم تعديل هذا الملف في مكان آخر. يمكنك إعادة التحميل لتحميل أحدث محتوى، أو مواصلة تحرير الإصدار الحالي (قد يتسبب في
    تعارضات في المحتوى).
  fileModifiedReload: إعادة تحميل
  saveConflictOverwrite: استبدال
  saveConflictDesc: >-
    تم تعديل هذا الملف على القرص من مصدر خارجي. يمكنك استبداله (تجاهل التعديلات الخارجية)، أو إعادة تحميل أحدث محتوى
    (تجاهل تعديلاتك غير المحفوظة)، أو الإلغاء.
