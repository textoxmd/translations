  colorThemeSpring: ربيع
  colorThemePastelStory: >-
    مستوحى من مزهرية GRÅVITS من ايكيا، كنت محظوظًا بلقاء phycat في مجتمع Typora. لوحة الألوان الخفيفة كأزهار الكرز
    وأجواؤها الدافئة والمريحة كانت تمامًا ما تصورته. من خلال التحسينات والتعديلات المتتالية، تحولت إلى تجربة كتابة ناعمة
    ومريحة للنظر تدعو للاسترخاء في Textox.
  colorThemeSpringStory: >-
    الربيع يرمز إلى البدايات والأمل. تم إطلاق Textox في ربيع 2026، وهو موسم لا يُنسى للمشروع. يتميز ثيم Jingzhe بالخضرة
    النباتية الناعمة والنظيفة، حيث تنقل الألوان روح الصحوة الربيعية. بعد التعديل والتكييف لـ Textox، يمنح كل جلسة كتابة
    أجواء منعشة وخفيفة كصباح الربيع.
