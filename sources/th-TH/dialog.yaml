dialog:
  selectFolder: เลือกโฟลเดอร์
  fileModifiedTitle: ไฟล์ถูกแก้ไข
  fileModifiedDesc: >-
    ไฟล์นี้ถูกแก้ไขที่อื่น คุณสามารถโหลดซ้ำเพื่อโหลดเนื้อหาล่าสุด หรือแก้ไขเวอร์ชันปัจจุบันต่อ
    (อาจทำให้เกิดข้อขัดแย้งของเนื้อหา)
  fileModifiedReload: โหลดซ้ำ
  saveConflictOverwrite: เขียนทับ
  saveConflictDesc: >-
    ไฟล์นี้ถูกแก้ไขบนดิสก์จากภายนอก คุณสามารถเขียนทับ (ละทิ้งการแก้ไขภายนอก) โหลดซ้ำเนื้อหาล่าสุด
    (ละทิ้งการแก้ไขที่ยังไม่ได้บันทึก) หรือยกเลิก
