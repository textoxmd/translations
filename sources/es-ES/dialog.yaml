dialog:
  selectFolder: Seleccionar carpeta
  fileModifiedTitle: Archivo modificado
  fileModifiedDesc: >-
    Este archivo ha sido modificado en otro lugar. Puedes recargar para cargar el contenido más reciente o continuar
    editando la versión actual (puede causar conflictos de contenido).
  fileModifiedReload: Recargar
  saveConflictOverwrite: Sobrescribir
  saveConflictDesc: >-
    Este archivo ha sido modificado en el disco. Puedes sobrescribirlo (descartando los cambios externos), recargar el
    contenido más reciente (descartando tus cambios sin guardar) o cancelar.
