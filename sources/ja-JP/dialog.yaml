dialog:
  selectFolder: フォルダを選択
  fileModifiedTitle: ファイルが変更されました
  fileModifiedDesc: このファイルは他の場所で変更されました。最新のコンテンツを読み込むために再読み込みするか、現在のバージョンを編集し続けることができます（コンテンツの競合が発生する可能性があります）。
  fileModifiedReload: 再読み込み
  saveConflictOverwrite: 上書き保存
  saveConflictDesc: >-
    このファイルはディスク上で外部から変更されています。上書き保存（外部の変更を破棄）、最新のコンテンツを再読み込み（未保存の変更を破棄）、またはキャンセルを選択できます。
